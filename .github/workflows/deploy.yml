name: Deploy to Cloudflare Pages

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Create the Pages project on first run. `wrangler pages deploy` does
      # NOT auto-create projects, so without this we get a "Project not found"
      # error on first deploy. After it exists, this step harmlessly errors
      # ("project already exists") and we continue to the deploy.
      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create helix-docs-staging --production-branch=development

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # New Cloudflare Pages project — created on first successful deploy
          # (see "Ensure Cloudflare Pages project exists" step above).
          # We deliberately did NOT point at the existing
          # helix-documentation-website-fork Worker so this preview can iterate
          # without disturbing whatever's at the old URL. Once we're happy,
          # we'll point a custom domain (eventually docs.helixgame.com) here
          # and retire the old Worker.
          #
          # NOTE: Cloudflare is slowly deprecating Pages in favour of Workers
          # Static Assets (per Arash, 2026-04-27). Pages keeps working for now
          # — we'll plan a migration in 12-18 months when the WSA tooling is
          # more mature.
          command: pages deploy build --project-name=helix-docs-staging
