<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" style="background:#1e1e1e">
  <!-- Grid -->
  <defs>
    <pattern id="g1" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
    </pattern>
    <pattern id="g2" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#g1)"/>
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#g2)"/>

  <!-- Wire: exec -->
  <path d="M 228 74 C 308 74, 252 54, 332 54" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>

  <!-- Node: Event BeginPlay (red header) -->
  <rect x="32" y="52" width="200" height="48" rx="6" fill="rgba(0,0,0,0.4)"/>
  <rect x="30" y="50" width="200" height="48" rx="6" fill="#262626" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="30" y="50" width="200" height="28" rx="6" fill="#8b0000"/>
  <rect x="30" y="72" width="200" height="6" fill="#8b0000"/>
  <line x1="30" y1="78" x2="230" y2="78" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
  <text x="42" y="68" fill="#fff" font-size="12" font-family="system-ui" font-weight="600">🔴 Event BeginPlay</text>
  <!-- exec out pin -->
  <polygon points="218,68 225,68 228,74 225,80 218,80" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Node: Print String (blue header) -->
  <rect x="332" y="32" width="260" height="152" rx="6" fill="rgba(0,0,0,0.4)"/>
  <rect x="330" y="30" width="260" height="152" rx="6" fill="#262626" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="330" y="30" width="260" height="28" rx="6" fill="#1b4a7a"/>
  <rect x="330" y="52" width="260" height="6" fill="#1b4a7a"/>
  <line x1="330" y1="58" x2="590" y2="58" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
  <text x="342" y="48" fill="#fff" font-size="12" font-family="system-ui" font-weight="600">Print String</text>

  <!-- exec in pin -->
  <polygon points="338,48 345,48 348,54 345,60 338,60" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
  <!-- exec out pin -->
  <polygon points="578,48 585,48 588,54 585,60 578,60" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- In String pin -->
  <circle cx="348" cy="78" r="6" fill="none" stroke="#f0a0c8" stroke-width="1.5"/>
  <text x="360" y="82" fill="#f0a0c8" font-size="11" font-family="system-ui" opacity="0.95">In String</text>
  <rect x="430" y="69" width="120" height="18" rx="3" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <text x="436" y="82" fill="#aaa" font-size="10" font-family="monospace">Hello HELIX!</text>

  <!-- Print to Screen pin -->
  <circle cx="348" cy="102" r="6" fill="#8b0000" stroke="#8b0000" stroke-width="1.5"/>
  <text x="360" y="106" fill="#8b0000" font-size="11" font-family="system-ui" opacity="0.95">Print to Screen</text>
  <rect x="460" y="93" width="50" height="18" rx="3" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <text x="470" y="106" fill="#aaa" font-size="10" font-family="monospace">true</text>

  <!-- Text Color pin -->
  <circle cx="348" cy="126" r="6" fill="none" stroke="#0088ff" stroke-width="1.5"/>
  <text x="360" y="130" fill="#0088ff" font-size="11" font-family="system-ui" opacity="0.95">Text Color</text>
  <rect x="440" y="117" width="60" height="18" rx="3" fill="rgba(0,200,200,0.2)" stroke="rgba(0,200,200,0.4)" stroke-width="0.5"/>
  <text x="452" y="130" fill="#0cc" font-size="10" font-family="monospace">Cyan</text>

  <!-- Duration pin -->
  <circle cx="348" cy="150" r="6" fill="none" stroke="#9cef43" stroke-width="1.5"/>
  <text x="360" y="154" fill="#9cef43" font-size="11" font-family="system-ui" opacity="0.95">Duration</text>
  <rect x="430" y="141" width="40" height="18" rx="3" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <text x="438" y="154" fill="#aaa" font-size="10" font-family="monospace">2.0</text>
</svg>